<main class="page"><span class="badge">02 · SAFE LAB</span><h1>SQL Injection 互動模擬</h1>
<p class="lead">這是一個純前端教學模擬器，不會連接真實資料庫或攻擊任何網站。</p>
<div class="lab"><div class="panel"><h2>🔓 Vulnerable Login</h2>
<label>Username</label><input id="user" placeholder="例如 alice">
<label>Password</label><input id="pass" type="text" placeholder="輸入測試資料">
<button class="btn primary" onclick="runLab()">執行模擬</button>
<div class="hint">提示：實驗資料會在瀏覽器內判斷，不會傳送到網路。</div></div>
<div class="panel"><h2>Query Inspector</h2><pre id="query">等待輸入...</pre><div id="result" class="result">尚未執行</div></div></div>
<div class="panel"><h2>防禦版比較</h2><pre>SELECT * FROM users WHERE username = ? AND password = ?;</pre>
<p>參數化查詢會把輸入當成資料，而不是讓輸入直接成為 SQL 語法的一部分。</p></div></main>
